apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-api
  namespace: NAMESPACE_PLACEHOLDER
  labels:
    app: payment-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-api
  template:
    metadata:
      labels:
        app: payment-api
    spec:
      containers:
        - name: payment-api
          image: honey-store/payment-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PORT
              value: "8080"
            - name: TEMPORAL_ADDRESS
              value: "temporal:7233"
            - name: BACKEND_URL
              value: "http://backend:3000"
            - name: SERVICE_LOCATION
              value: "cloud"
            - name: CONNECTION_METHOD
              value: "direct"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: payment-api
  namespace: NAMESPACE_PLACEHOLDER
  labels:
    app: payment-api
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: payment-api
